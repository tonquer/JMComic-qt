# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  windows:
    runs-on: windows-latest
    env:
      PACKAGENAME: jmcomic_py39_windows_x64
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r src\requirements.txt
        
        $imageformatsPath = python -c "import os, PySide6; print(os.path.join(os.path.dirname(PySide6.__file__), 'plugins', 'imageformats'))"
        cp lib\qjpegxl6.dll $imageformatsPath"\"
        cp lib\qavif6.dll $imageformatsPath"\"

        Invoke-WebRequest -Uri "https://github.com/upx/upx/releases/download/v5.0.1/upx-5.0.1-win64.zip" -OutFile "upx.zip"
        Expand-Archive -Path "upx.zip" -DestinationPath "D:\"
        Remove-Item "upx.zip"
    - name: Build
      run: |
        python script/build_qrc.py
        cd src
        cp ..\res\icon\icon.ico .\

        pyinstaller --hidden-import=_cffi_backend --collect-all curl_cffi -F -w -i icon.ico start.py --upx-dir "D:\upx-5.0.1-win64"
        mv dist jmcomic
        cp ..\LICENSE jmcomic\
        cp ..\CHANGELOG jmcomic\
        cd ..
        mkdir ${{ env.PACKAGENAME }}
        mv src\jmcomic ${{ env.PACKAGENAME }}
        7z a -r "$($Env:PACKAGENAME + '.zip')" "${{ env.PACKAGENAME }}"
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PACKAGENAME }}
        path: ${{ env.PACKAGENAME }}
        retention-days: 7

  ubuntu-appimage:
    runs-on: ubuntu-latest
    container:
      image: tonquer/ubuntu-python:24.04
      options: --privileged
    env:
      PACKAGENAME: jmcomic_py310_linux_glibc2.39
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r src/requirements.txt
    - name: Build
      run: |
        python3 script/build_qrc.py
        cd src
        pyinstaller --hidden-import=_cffi_backend --collect-all curl_cffi  -w start.py
        cd dist
        mkdir -p jmcomic.AppRun/usr/bin
        cp -r ../../res/appimage/* jmcomic.AppRun/
        cp -r ../../res/icon/logo_round.png jmcomic.AppRun/JMComic.png
        cp -r start/* jmcomic.AppRun/usr/bin/

        chmod +x jmcomic.AppRun/AppRun
        chmod +x jmcomic.AppRun/usr/bin/start
        appimagetool-x86_64.AppImage jmcomic.AppRun
        mv JMComic-x86_64.AppImage ../../${{ env.PACKAGENAME }}.AppImage
        cd ../..
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PACKAGENAME }}
        path: ${{ env.PACKAGENAME }}.AppImage
        retention-days: 7

  macos:
    runs-on: macos-latest
    env:
      PACKAGENAME: jmcomic_py39_macos
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install sr-vulkan
        pip install sr-vulkan-model-waifu2x
        pip install sr-vulkan-model-realcugan
        pip install sr-vulkan-model-realesrgan
        cd script
        pip install delocate wheel_filename==1.4.2
        python build_universal2.py pillow
        python build_universal2.py pillow_jxl_plugin
        python build_universal2.py pillow_avif_plugin
        python build_universal2.py cffi 2.1.1
        python build_universal2.py curl_cffi 0.16.3
        python build_universal2.py pyyaml 6.0.3
        pip install *.whl
        cd ..
        pip install -r src/requirements_macos.txt
        brew install create-dmg
    - name: Build
      run: |
        python script/build_qrc.py
        cd src
        cp ../res/icon/Icon.icns ./
        pyinstaller --target-architecture=universal2 --clean --onedir --name JMComic \
            --hidden-import sr_vulkan --hidden-import _cffi_backend --collect-all curl_cffi --hidden-import PySide6 --hidden-import requests \
            --hidden-import urllib3 --hidden-import websocket-client --hidden-import pillow \
            --hidden-import config \
            --hidden-import component \
            --hidden-import server \
            --hidden-import task \
            --hidden-import tools \
            --hidden-import view \
            --strip --windowed -i Icon.icns \
            start.py
        xattr -cr dist/JMComic.app
        create-dmg --volname "JMComic" --volicon "Icon.icns" --icon "JMComic.app" 200 190 \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --hide-extension "JMComic.app" --app-drop-link 600 185 \
            ${{ env.PACKAGENAME }}.dmg dist/JMComic.app

        zip -9 jmcomic.zip ${{ env.PACKAGENAME }}.dmg
        mv ${{ env.PACKAGENAME }}.dmg ..
        mv jmcomic.zip ..
        cd ..
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PACKAGENAME }}
        path: ${{ env.PACKAGENAME }}.dmg
        retention-days: 7
