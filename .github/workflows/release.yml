name: release
on:
  push:
    tags:
      - '*'
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      PACKAGE_PREFIX: ${{ steps.get-package_prefix.outputs.PACKAGE_PREFIX }}
      TAG_NAME: ${{ steps.get-package_prefix.outputs.TAG_NAME }}
      HEAD_SHA_SHORT: ${{ steps.get-package_prefix.outputs.HEAD_SHA_SHORT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
      - name: get-package_prefix
        id: get-package_prefix
        run: |
          LIB_NAME=jmcomic
          TAG_NAME=$(git describe --abbrev=0 --tags)
          HEAD_SHA_SHORT=$(git rev-parse --short HEAD)
          echo "::set-output name=PACKAGE_PREFIX::${LIB_NAME}_${TAG_NAME}"
          echo "::set-output name=TAG_NAME::${TAG_NAME}"
          echo "::set-output name=HEAD_SHA_SHORT::${HEAD_SHA_SHORT}"

  release:
    needs: [setup]
    runs-on: ubuntu-latest
    outputs:
      Up_Url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: create_release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.setup.outputs.TAG_NAME }}
          release_name: ${{ needs.setup.outputs.TAG_NAME }}
          draft: true
          prerelease: true

  macos:
    needs: [setup, release]
    runs-on: macos-latest
    env:
      PACKAGENAME: ${{ needs.setup.outputs.PACKAGE_PREFIX }}_macos_universal2.dmg
      PACKAGENAME_NOSR: ${{ needs.setup.outputs.PACKAGE_PREFIX }}_macos_nosr_universal2.dmg
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        cd script
        pip install delocate wheel_filename==1.4.2
        python build_universal2.py pillow
        python build_universal2.py cffi 1.17.1
        python build_universal2.py curl_cffi 0.13.0
        python build_universal2.py pyyaml 6.0.2
        pip install *.whl
        cd ..
        pip install -r src/requirements_macos.txt
        brew install create-dmg
    - name: Build_nosr
      run: |
        python script/build_qrc.py
        cd src
        cp ../res/icon/Icon.icns ./
        pyinstaller -y --target-architecture=universal2 --clean --onedir --name JMComic \
            --hidden-import sr_ncnn_vulkan --hidden-import PySide6 --hidden-import requests \
            --hidden-import urllib3 --hidden-import websocket-client --hidden-import pillow \
            --hidden-import config \
            --hidden-import component \
            --hidden-import server \
            --hidden-import task \
            --hidden-import tools \
            --hidden-import view \
            --strip --windowed -i Icon.icns \
            start.py
        xattr -cr dist/JMComic.app
        create-dmg --volname "JMComic" --volicon "Icon.icns" --icon "JMComic.app" 200 190 \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --hide-extension "JMComic.app" --app-drop-link 600 185 \
            ${{ env.PACKAGENAME_NOSR }} dist/JMComic.app

        mv ${{ env.PACKAGENAME_NOSR }} ..
        cd ..
    - name: Build
      run: |
        pip install sr-vulkan
        pip install sr-vulkan-model-waifu2x
        pip install sr-vulkan-model-realcugan
        pip install sr-vulkan-model-realesrgan
        cd src
        cp ../res/icon/Icon.icns ./
        pyinstaller -y --target-architecture=universal2 --clean --onedir --name JMComic \
            --hidden-import sr_ncnn_vulkan --hidden-import PySide6 --hidden-import requests \
            --hidden-import urllib3 --hidden-import websocket-client --hidden-import pillow \
            --hidden-import config \
            --hidden-import component \
            --hidden-import server \
            --hidden-import task \
            --hidden-import tools \
            --hidden-import view \
            --strip --windowed -i Icon.icns \
            start.py
        xattr -cr dist/JMComic.app
        create-dmg --volname "JMComic" --volicon "Icon.icns" --icon "JMComic.app" 200 190 \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --hide-extension "JMComic.app" --app-drop-link 600 185 \
            ${{ env.PACKAGENAME }} dist/JMComic.app

        mv ${{ env.PACKAGENAME }} ..
        cd ..
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PACKAGENAME }}
        path: jmcomic.zip
    - name: upload-macos
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.release.outputs.Up_Url }}
        asset_path: ${{ env.PACKAGENAME }}
        asset_name: ${{ env.PACKAGENAME }}
        asset_content_type: application/gzip
    - name: upload-macos-nosr
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.release.outputs.Up_Url }}
        asset_path: ${{ env.PACKAGENAME_NOSR }}
        asset_name: ${{ env.PACKAGENAME_NOSR }}
        asset_content_type: application/gzip

  windows:
    if: github.event_name == 'push' || github.event.inputs.build_windows == 'true'
    needs: [setup, release]
    runs-on: windows-latest
    env:
      PACKAGENAME: ${{ needs.setup.outputs.PACKAGE_PREFIX }}_windows_x64.7z
      PACKAGENAME_NOSR: ${{ needs.setup.outputs.PACKAGE_PREFIX }}_windows_nosr_x64.7z
      EXE_NAME: start.exe
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r src\requirements_nosr.txt
        Invoke-WebRequest -Uri "https://github.com/upx/upx/releases/download/v5.0.1/upx-5.0.1-win64.zip" -OutFile "upx.zip"
        Expand-Archive -Path "upx.zip" -DestinationPath "D:\"
        Remove-Item "upx.zip"
    - name: Build_nosr
      run: |
        python script/build_qrc.py
        cd src
        cp ..\res\icon\icon.ico .\
        pyinstaller -y --hidden-import=_cffi_backend --collect-all curl_cffi  -F -w -i icon.ico start.py --upx-dir "D:\upx-5.0.1-win64"

        $pkg = "jmcomic"
        Remove-Item -Recurse -Force $pkg -ErrorAction SilentlyContinue
        New-Item $pkg -ItemType Directory
        Move-Item "dist\$env:EXE_NAME" "$pkg\start.exe"
        Copy-Item ..\LICENSE                $pkg\
        Copy-Item ..\CHANGELOG              $pkg\
        7z a -t7z -mx9 "$env:PACKAGENAME_NOSR" $pkg
        Move-Item "${env:PACKAGENAME_NOSR}" ..\
        cd ..
    - name: Build
      run: |
        pip install -r src\requirements.txt
        cd src
        cp ..\res\icon\icon.ico .\
        pyinstaller -y --hidden-import=_cffi_backend --collect-all curl_cffi  -F -w -i icon.ico start.py --upx-dir "D:\upx-5.0.1-win64"

        $pkg = "jmcomic"
        Remove-Item -Recurse -Force $pkg -ErrorAction SilentlyContinue
        New-Item $pkg -ItemType Directory
        Move-Item "dist\$env:EXE_NAME" "$pkg\start.exe"
        Copy-Item ..\LICENSE                $pkg\
        Copy-Item ..\CHANGELOG              $pkg\
        7z a -t7z -mx9 "$env:PACKAGENAME" $pkg
        Move-Item "${env:PACKAGENAME}" ..\
        cd ..

    - name: upload-win
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url:         ${{ needs.release.outputs.Up_Url }}
        asset_path:         ${{ env.PACKAGENAME }}
        asset_name:         ${{ env.PACKAGENAME }}
        asset_content_type: application/x-7z-compressed
    - name: upload-win-nosr
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url:         ${{ needs.release.outputs.Up_Url }}
        asset_path:         ${{ env.PACKAGENAME_NOSR }}
        asset_name:         ${{ env.PACKAGENAME_NOSR }}
        asset_content_type: application/x-7z-compressed

  ubuntu:
    if: github.event_name == 'push' || github.event.inputs.build_ubuntu == 'true'
    needs: [setup, release]
    runs-on: ubuntu-latest
    container:
      image: tonquer/ubuntu-python:22.04
      options: --privileged
    env:
      PACKAGENAME: ${{ needs.setup.outputs.PACKAGE_PREFIX }}_ubuntu_amd64.deb
      PACKAGENAME_NOSR: ${{ needs.setup.outputs.PACKAGE_PREFIX }}_ubuntu_nosr_amd64.deb
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r src/requirements_nosr.txt
        python3 script/build_qrc.py
    - name: Build_nosr
      run: |
        cd src
        pyinstaller -y --hidden-import=_cffi_backend --collect-all curl_cffi  -w start.py
        cd dist
        cp -r ../../res/ubuntu .
        find start -name "libxkbcommon*" -delete
        cp -r start/* ubuntu/opt/JMComic/
        chmod -R 755 ubuntu
        dpkg-deb --root-owner-group  -b ubuntu jmcomic.deb
        mv jmcomic.deb ../../${{ env.PACKAGENAME_NOSR }}
        cd ../..
    - name: Build
      run: |
        pip install -r src/requirements.txt
        cd src
        pyinstaller -y --hidden-import=_cffi_backend --collect-all curl_cffi  -w start.py
        cd dist
        cp -r ../../res/ubuntu .
        find start -name "libxkbcommon*" -delete
        cp -r start/* ubuntu/opt/JMComic/
        chmod -R 755 ubuntu
        dpkg-deb --root-owner-group  -b ubuntu jmcomic.deb
        mv jmcomic.deb ../../${{ env.PACKAGENAME }}
        cd ../..

    - name: upload-ubuntu
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url:         ${{ needs.release.outputs.Up_Url }}
        asset_path:         ${{ env.PACKAGENAME }}
        asset_name:         ${{ env.PACKAGENAME }}
        asset_content_type: application/gzip

    - name: upload-ubuntu-nosr
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url:         ${{ needs.release.outputs.Up_Url }}
        asset_path:         ${{ env.PACKAGENAME_NOSR }}
        asset_name:         ${{ env.PACKAGENAME_NOSR }}
        asset_content_type: application/gzip

  uos:
    if: github.event_name == 'push' || github.event.inputs.build_uos == 'true'
    needs: [setup, release]
    runs-on: ubuntu-latest
    container:
      image: tonquer/deepin-python:v20
      options: --privileged
    env:
      PACKAGENAME: ${{ needs.setup.outputs.PACKAGE_PREFIX }}_uos_amd64.deb
      PACKAGENAME_NOSR: ${{ needs.setup.outputs.PACKAGE_PREFIX }}_uos_nosr_amd64.deb
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r src/requirements_nosr.txt
        python3 script/build_qrc.py
    - name: Build_nosr
      run: |
        cd src
        pyinstaller -y --hidden-import=_cffi_backend --collect-all curl_cffi  -w start.py
        cd dist
        cp -r ../../res/uos .
        find start -name "libxkbcommon*" -delete
        cp -r start/* uos/opt/apps/org.tonquer.jmcomic/files/
        chmod -R 755 uos
        dpkg-deb --root-owner-group  -b uos jmcomic.deb
        mv jmcomic.deb ../../${{ env.PACKAGENAME_NOSR }}
        cd ../..
    - name: Build
      run: |
        pip install -r src/requirements.txt
        cd src
        pyinstaller -y --hidden-import=_cffi_backend --collect-all curl_cffi  -w start.py
        cd dist
        cp -r ../../res/uos .
        find start -name "libxkbcommon*" -delete
        cp -r start/* uos/opt/apps/org.tonquer.jmcomic/files/
        chmod -R 755 uos
        dpkg-deb --root-owner-group  -b uos jmcomic.deb
        mv jmcomic.deb ../../${{ env.PACKAGENAME }}
        cd ../..

    - name: upload-uos
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url:         ${{ needs.release.outputs.Up_Url }}
        asset_path:         ${{ env.PACKAGENAME }}
        asset_name:         ${{ env.PACKAGENAME }}
        asset_content_type: application/gzip

    - name: upload-uos-nosr
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url:         ${{ needs.release.outputs.Up_Url }}
        asset_path:         ${{ env.PACKAGENAME_NOSR }}
        asset_name:         ${{ env.PACKAGENAME_NOSR }}
        asset_content_type: application/gzip

  ubuntu-appimage228:
    if: github.event_name == 'push' || github.event.inputs.build_appimage == 'true'
    needs: [setup, release]
    runs-on: ubuntu-latest
    container:
      image: tonquer/deepin-python:v20
      options: --privileged
    env:
      PACKAGENAME: ${{ needs.setup.outputs.PACKAGE_PREFIX }}_linux-glibc2.28.AppImage
      PACKAGENAME_NOSR: ${{ needs.setup.outputs.PACKAGE_PREFIX }}_linux_nosr-glibc2.28.AppImage
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r src/requirements_nosr.txt
        python3 script/build_qrc.py
    - name: Build_nosr
      run: |
        cd src
        pyinstaller -y --hidden-import=_cffi_backend --collect-all curl_cffi  -w start.py
        cd dist
        mkdir -p jmcomic.AppRun/usr/bin
        cp -r ../../res/appimage/* jmcomic.AppRun/
        cp -r ../../res/icon/logo_round.png jmcomic.AppRun/JMComic.png
        find start -name "libxkbcommon*" -delete
        cp -r start/* jmcomic.AppRun/usr/bin/

        chmod +x jmcomic.AppRun/AppRun
        chmod +x jmcomic.AppRun/usr/bin/start
        appimagetool-x86_64.AppImage jmcomic.AppRun
        mv JMComic-x86_64.AppImage ../../${{ env.PACKAGENAME_NOSR }}
        cd ../..
    - name: Build
      run: |
        pip install -r src/requirements.txt
        cd src
        pyinstaller -y --hidden-import=_cffi_backend --collect-all curl_cffi  -w start.py
        cd dist
        mkdir -p jmcomic.AppRun/usr/bin
        cp -r ../../res/appimage/* jmcomic.AppRun/
        cp -r ../../res/icon/logo_round.png jmcomic.AppRun/JMComic.png
        find start -name "libxkbcommon*" -delete
        cp -r start/* jmcomic.AppRun/usr/bin/

        chmod +x jmcomic.AppRun/AppRun
        chmod +x jmcomic.AppRun/usr/bin/start
        appimagetool-x86_64.AppImage jmcomic.AppRun
        mv JMComic-x86_64.AppImage ../../${{ env.PACKAGENAME }}
        cd ../..

    - name: upload-uos
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url:         ${{ needs.release.outputs.Up_Url }}
        asset_path:         ${{ env.PACKAGENAME }}
        asset_name:         ${{ env.PACKAGENAME }}
        asset_content_type: application/gzip

    - name: upload-uos-nosr
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url:         ${{ needs.release.outputs.Up_Url }}
        asset_path:         ${{ env.PACKAGENAME_NOSR }}
        asset_name:         ${{ env.PACKAGENAME_NOSR }}
        asset_content_type: application/gzip

  ubuntu-appimage239:
    if: github.event_name == 'push' || github.event.inputs.build_appimage == 'true'
    needs: [setup, release]
    runs-on: ubuntu-latest
    container:
      image: tonquer/ubuntu-python:24.04
      options: --privileged
    env:
      PACKAGENAME: ${{ needs.setup.outputs.PACKAGE_PREFIX }}_linux-glibc2.39.AppImage
      PACKAGENAME_NOSR: ${{ needs.setup.outputs.PACKAGE_PREFIX }}_linux_nosr-glibc2.39.AppImage
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r src/requirements_nosr.txt
        python3 script/build_qrc.py
    - name: Build_nosr
      run: |
        cd src
        pyinstaller -y --hidden-import=_cffi_backend --collect-all curl_cffi  -w start.py
        cd dist
        mkdir -p jmcomic.AppRun/usr/bin
        cp -r ../../res/appimage/* jmcomic.AppRun/
        cp -r ../../res/icon/logo_round.png jmcomic.AppRun/JMComic.png
        find start -name "libxkbcommon*" -delete
        cp -r start/* jmcomic.AppRun/usr/bin/

        chmod +x jmcomic.AppRun/AppRun
        chmod +x jmcomic.AppRun/usr/bin/start
        appimagetool-x86_64.AppImage jmcomic.AppRun
        mv JMComic-x86_64.AppImage ../../${{ env.PACKAGENAME_NOSR }}
        cd ../..
    - name: Build
      run: |
        pip install -r src/requirements.txt
        cd src
        pyinstaller -y --hidden-import=_cffi_backend --collect-all curl_cffi  -w start.py
        cd dist
        mkdir -p jmcomic.AppRun/usr/bin
        cp -r ../../res/appimage/* jmcomic.AppRun/
        cp -r ../../res/icon/logo_round.png jmcomic.AppRun/JMComic.png
        find start -name "libxkbcommon*" -delete
        cp -r start/* jmcomic.AppRun/usr/bin/

        chmod +x jmcomic.AppRun/AppRun
        chmod +x jmcomic.AppRun/usr/bin/start
        appimagetool-x86_64.AppImage jmcomic.AppRun
        mv JMComic-x86_64.AppImage ../../${{ env.PACKAGENAME }}
        cd ../..

    - name: upload-appImage
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url:         ${{ needs.release.outputs.Up_Url }}
        asset_path:         ${{ env.PACKAGENAME }}
        asset_name:         ${{ env.PACKAGENAME }}
        asset_content_type: application/gzip

    - name: upload-appImage-nosr
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url:         ${{ needs.release.outputs.Up_Url }}
        asset_path:         ${{ env.PACKAGENAME_NOSR }}
        asset_name:         ${{ env.PACKAGENAME_NOSR }}
        asset_content_type: application/gzip